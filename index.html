<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  color: white;
  text-align: center;
}

  /* abertura */
#start {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#start button {
  padding: 20px 30px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  background: gold;
  box-shadow: 0 0 20px gold;
}
    .container {
  position: relative;
}

.links {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.btn {
  position: absolute;
  background: rgba(255,0,0,0.3); /* TEMPORÁRIO pra você enxergar */
  border: 2px solid white;
}

/* vídeo */
video {
  width: 100%;
  height: 100vh;
  object-fit: cover;
}

/* botões */
.botoes {
  position: fixed;
  bottom: 20px;
  width: 100%;
}

.botoes a {
  margin: 5px;
  padding: 12px 18px;
  background: gold;
  color: black;
  border-radius: 20px;
  text-decoration: none;
  display: inline-block;
}

/* contador */
#contador {
  position: fixed;
  top: 20px;
  width: 100%;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="start">
  <button onclick="abrir()">Abrir convite ✨</button>
</div>

<div id="contador"></div>

<div class="container">
  <video id="video" playsinline style="width:100%; height:100vh; object-fit:cover;">
    <source src="convite.mp4" type="video/mp4">
  </video>
  
  <div class="links">
    <a href="https://wa.me/SEUNUMERO" class="btn confirmar"></a>
    <a href="https://maps.google.com" class="btn local"></a>
  </div>
</div>
</style>
<audio id="musica" src="musica.mp3"></audio>

<div class="botoes">
  <a href="#">💌 Confirmar Presença</a>
  <a href="#">📍 Localização</a>
</div>

<script>
function abrir(){
  document.getElementById("start").style.display = "none";
  document.getElementById("video").play();
  document.getElementById("musica").play();
}

/* contador */
const dataEvento = new Date("2026-12-25");
setInterval(() => {
  const agora = new Date();
  const diff = dataEvento - agora;

  const dias = Math.floor(diff / (1000*60*60*24));

  document.getElementById("contador").innerHTML =
    "Faltam " + dias + " dias ✨";
}, 1000);
</script>

</body>
</html>
